topTitle: Open-Source Web Developer and Author
title: >
  ## About Me

  I'm a Queer Red River Métis writer, and JAMstack developer who works within the hybrid of technology, creativity, and community.
content: >
  ## I love writing and I love coding.

  <i class="fa-solid fa-hand"></i> Hi there! I'm Brennan Kenneth Brown (my friends call me Kenny). I write daily and build in the open:

  - <i class="fa-solid fa-pen-nib"></i> **+500,000 words** across +280 posts, with 2,000 avg. words per post on [brennan.day](https://brennan.day) since January 2025

  - <i class="fa-solid fa-keyboard"></i> **1,400+ hours** logged coding since 2017 via [WakaTime](https://wakatime.com/@brennan). Markdown, HTML, JavaScript, CSS, and Python

  - <i class="fa-solid fa-laptop-code"></i> **[Open-Source Contributor](https://github.com/brennanbrown)**: Created 30+ free Jekyll/Eleventy/Hugo themes and tools used by developers worldwide

  - <i class="fa-solid fa-briefcase"></i> **Founder of [Berry House](https://berryhouse.ca)**: Building a more human-centric web through JAMstack development and compelling storytelling

  - <i class="fa-solid fa-book-open"></i> **[Published Author](https://www.amazon.ca/stores/author/B0DQTPYKHD)**: Nine independent books of poetry and essays exploring identity, love, faith, and the human experience

  - <i class="fa-solid fa-hand-fist"></i> **Indigenous & Queer Voice**: Committed to empowering marginalized communities and centering stories that matter

  - <i class="fa-solid fa-graduation-cap"></i> **English Honours Graduate**: Mount Royal University, 3.8 GPA, founder of [Write Club](https://writeclub.ca) creative writing community

  <hr/>My sites are fast and framework-light. Eleventy, Hugo, and Jekyll for generation. Nunjucks and Go templates for layouts. Markdown and YAML for content. Vanilla CSS with no heavy frameworks. We can make the Internet simple and human.

